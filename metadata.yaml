help: |
  我的世界 MW：她自己会生活，工具交回 AstrBot 原生 Agent。

  主回复不再由本插件代打：插件只把「她是谁、现在在哪、什么心情、最近发生什么」
  注入到宿主的请求里，调模型、工具循环、发送都按 AstrBot 原生流程走。
  动作库里的「虚拟动作」只影响她的世界与提示词，不再挂工具、不再抢工具循环。

  指令前缀是 mw，别名「我的世界」和 myworld（写哪个都一样）。
  下面示例按 AstrBot 出厂唤醒前缀 / 书写；如果你的唤醒前缀是 ! # . 之类，
  请把 /mw 换成 !mw、#mw；如果清空了唤醒前缀，就直接私聊或 @机器人 后写 mw xxx。

  常用指令：
  - /mw status：她现在在哪、在做什么、心情与各项数值
  - /mw memory：看看她记得你什么
  - /mw recall <话题>：让她回忆某个话题
  - /我的画像、/设置画像、/画像历史：兼容原心迹画像的完整指令组
  - /mw profile：统一通讯录画像入口
  - /mw event <一句话>：给她安排一件会发生的事
  - /mw schedule：查看全部日程
  - /mw session add：把当前会话加进白名单
  - /mw help：完整指令表

  编辑器（AstrBot 面板 → 插件 → 我的世界 MW → 我的世界编辑器）：
  控制台、内心活动、事件、通讯录、记忆库、日志、运行、调试、地图、动作库、日程、会话、全局设置、预设。
  通讯录已原生融合原「心迹画像」：一个联系人模型统一关系、称呼、备注、字段、历史与审计；
  原插件指令与三个 LLM 画像工具保留，新增 mw_profile_lookup 主动查询画像、关系和共同经历。
  确认迁移后可以停用旧插件；详细画像与经历统一在通讯录「认识与经历」中查看。
  地图可以「生成区域…」、日程可以「生成日程…」、事件可以「生成事件…」：
  生成器会先读她的人设、已有世界和人际关系，把草稿摆出来给你改，确认之后才写进去。
