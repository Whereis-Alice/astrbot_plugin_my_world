desc: >-
  给 Bot 一个会自己长出来的世界：区域、地点、虚拟动作、日程、事件、情绪与场景记忆都由她自己规划；
  主回复仍然走 AstrBot 原生 Agent——人设与处境由本插件注入，工具调用、工具循环、发送全交给宿主，
  不抢工具、不丢上下文。
