help: |
  给角色持续运行的生活：地图、活动、作息、事件、情绪、记忆与人际关系。
  聊天使用 AstrBot 原生 Agent；本插件提供角色此刻的处境和生活背景。

  先在目标会话发送 /mw session add，再打开插件页面“小世界”。
  选择人设、调整地图与动作；新建世界每天自动生成两项安排，自主作息默认开启。
  在「设置 → 自主发言」应用全局会话白名单，才允许她主动发言；正常回复与安静生活照常。
  主动讲自己的生活还需额外勾选「生活分享」；默认不授权，群聊与私聊可分别选择。
  恋爱、主人等特殊关系默认只允许管理员设置，可在关系表逐类开启自然形成。

  /mw status：当前状态
  /mw memory、/mw recall <话题>：记忆与回忆
  /mw profile：通讯录画像
  /mw schedule、/mw map：日程与地图
  /mw help：完整帮助

  示例使用默认唤醒前缀 /，请按 AstrBot 设置替换。
  更详细的设置、关系规则与排查说明见仓库文档。
