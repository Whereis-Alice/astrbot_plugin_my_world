name: CI

# 用户持久要求：今后禁止跑 CI。仅保留手动定义以供备查；
# 未经用户明确重新授权，不得手动运行或恢复任何自动触发器。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install browser
        timeout-minutes: 5
        run: |
          # Azure's font downloads repeatedly stalled on this runner image.
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q --durations=50
